minimumReleaseAgeExclude:
  # Intentionally pinned fresh releases that are required for this upgrade.
  - "@effect/tsgo@0.63.0"
  - "@effect/tsgo-darwin-arm64@0.63.0"
  - "@effect/tsgo-darwin-x64@0.63.0"
  - "@effect/tsgo-linux-arm64@0.63.0"
  - "@effect/tsgo-linux-arm@0.63.0"
  - "@effect/tsgo-linux-x64@0.63.0"
  - "@effect/tsgo-win32-arm64@0.63.0"
  - "@effect/tsgo-win32-x64@0.63.0"
  - "@effect/vitest@4.0.7"
  - "effect@4.0.7"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: "*"
allowBuilds:
  # Effect's MessagePack support has a portable fallback; native extraction is
  # unnecessary for this library's development and verification workflows.
  msgpackr-extract: false
