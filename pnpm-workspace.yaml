pmOnFail: error
minimumReleaseAgeExclude:
  - "@schnau/tsconfig"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
allowBuilds:
  # Effect's MessagePack support has a portable fallback; native extraction is
  # unnecessary for this library's development and verification workflows.
  msgpackr-extract: false
